<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Welcome Display</title>
<style>
  :root{
    --bg:#ffffff; --ink:#15191e; --dim:#6b7075;
    --accent:#C8102E;            /* default Burkes accent; overridden per visitor */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;cursor:none;}
  body{font-family:Arial,"Segoe UI",system-ui,sans-serif;color:var(--ink);
       -webkit-font-smoothing:antialiased;}
  #stage{position:relative;height:100%;}

  /* two scene layers so one can crossfade in behind the other */
  .scene{position:absolute;inset:0;background:var(--bg);opacity:0;
         transition:opacity 700ms ease;}
  .scene.on{opacity:1;}
  @media (prefers-reduced-motion:reduce){.scene{transition:none;}}

  /* full-width accent bars */
  .bar{position:absolute;left:0;right:0;height:.7vh;background:var(--accent);}
  .bar.top{top:0;} .bar.bot{bottom:0;}
  .hair{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--accent) 30%, var(--bg));}
  .hair.top{top:2vh;} .hair.bot{bottom:2vh;}

  /* corner registration brackets */
  .bk{position:absolute;width:5vh;height:5vh;border:.32vh solid var(--accent);}
  .bk.tl{top:2.6vh;left:2.4vw;border-right:0;border-bottom:0;}
  .bk.tr{top:2.6vh;right:2.4vw;border-left:0;border-bottom:0;}
  .bk.bl{bottom:2.6vh;left:2.4vw;border-right:0;border-top:0;}
  .bk.br{bottom:2.6vh;right:2.4vw;border-left:0;border-top:0;}

  .content{position:absolute;inset:0;display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;padding:8vh 8vw;}
  .eyebrow{font-weight:700;letter-spacing:.13em;text-transform:uppercase;
           font-size:3.1vw;line-height:1;margin-bottom:4vh;}
  .eyebrow .accent{color:var(--accent);}

  .logo{max-height:34vh;max-width:74vw;object-fit:contain;}

  .company{font-weight:800;line-height:.96;letter-spacing:-.01em;
           font-size:11vw;word-break:break-word;max-width:88vw;}
  .company .rule{display:block;height:1.1vh;width:42%;margin:3.2vh auto 0;
                 background:var(--accent);}

  .note{font-weight:400;color:var(--dim);font-size:2vw;margin-top:4vh;max-width:60ch;}
  .note:empty{display:none;}
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ------------------------------------------------------------------
   CONFIG — the block that normally needs editing.
------------------------------------------------------------------ */
const CONFIG = {
  scheduleUrl:   "schedule.json",
  pollSeconds:   30,          // how often to re-read the schedule
  rotateSeconds: 12,          // dwell when several visitors are on site at once
  eyebrowLead:   "BURKES",    // "BURKES WELCOMES"
  eyebrowAccent: "WELCOMES",
  defaultAccent: "#C8102E",   // Burkes brand red (from burkesintelligence.com)

  // Screen is live only inside this window. Outside it: black.
  hours: { days:[1,2,3,4,5], start:"06:00", end:"17:00" }   // 0 = Sunday
};

/* Used only when schedule.json can't be reached — lets you open this file
   straight off disk to see the layout. REMOVE the fallback for production. */
const DEMO_SCHEDULE = {
  visitors: [
    { company:"Clayco", logo:"logos/clayco.png", brandColor:"#EC3222",
      note:"Fabrication walkthrough with the project team",
      start:"2000-01-01T00:00:00", end:"2099-01-01T00:00:00" }
  ]
};
/* ------------------------------------------------------------------ */

const stage = document.getElementById("stage");
let visitors = [];
let index = 0;
let showingKey = null;
let urlMode = false;   // true when the visit is passed in the URL (see queryVisit)

function parseHM(hm){ const [h,m]=hm.split(":").map(Number); return h*60+m; }
function withinHours(now){
  if(!CONFIG.hours.days.includes(now.getDay())) return false;
  const mins = now.getHours()*60 + now.getMinutes();
  return mins >= parseHM(CONFIG.hours.start) && mins < parseHM(CONFIG.hours.end);
}
function activeVisitors(all, now){
  return all.filter(v=>{
    const s = v.start ? new Date(v.start) : null;
    const e = v.end   ? new Date(v.end)   : null;
    if(s && now < s) return false;
    if(e && now > e) return false;
    return true;
  });
}

function frame(el){
  el.insertAdjacentHTML("beforeend",
    '<div class="bar top"></div><div class="bar bot"></div>'+
    '<div class="hair top"></div><div class="hair bot"></div>'+
    '<div class="bk tl"></div><div class="bk tr"></div>'+
    '<div class="bk bl"></div><div class="bk br"></div>');
}

function buildScene(v){
  const el = document.createElement("div");
  el.className = "scene";
  el.style.setProperty("--accent", v.brandColor || CONFIG.defaultAccent);
  frame(el);

  const content = document.createElement("div");
  content.className = "content";

  const eyebrow = document.createElement("div");
  eyebrow.className = "eyebrow";
  eyebrow.innerHTML = '<span class="lead"></span> <span class="accent"></span>';
  eyebrow.querySelector(".lead").textContent = CONFIG.eyebrowLead;
  eyebrow.querySelector(".accent").textContent = CONFIG.eyebrowAccent;
  content.appendChild(eyebrow);

  // company-name element (hero when no logo, fallback if a logo fails)
  const company = document.createElement("div");
  company.className = "company";
  company.innerHTML = '<span class="name"></span><span class="rule"></span>';
  company.querySelector(".name").textContent = v.company || "";

  if(v.logo){
    const img = document.createElement("img");
    img.className = "logo";
    img.src = v.logo; img.alt = "";
    company.style.display = "none";           // logo is the hero
    img.onerror = () => { img.remove(); company.style.display = ""; fitCompany(el); };
    content.appendChild(img);
    content.appendChild(company);
  } else {
    content.appendChild(company);             // name is the hero
  }

  const note = document.createElement("div");
  note.className = "note";
  note.textContent = v.note || "";
  content.appendChild(note);

  el.appendChild(content);
  return el;
}

function fitCompany(el){
  const company = el.querySelector(".company");
  if(!company || company.style.display === "none") return;
  const content = el.querySelector(".content");
  let size = 11;
  const name = company.querySelector(".name");
  name.style.fontSize = size + "vw";
  while(content.scrollHeight > content.clientHeight && size > 3){
    size -= 0.5; name.style.fontSize = size + "vw";
  }
}

function render(v){
  const key = v ? JSON.stringify(v) : "__blank__";
  if(key === showingKey) return;
  showingKey = key;
  const outgoing = stage.querySelector(".scene");

  if(!v){
    if(outgoing){ outgoing.classList.remove("on"); setTimeout(()=>outgoing.remove(),800); }
    document.body.style.background = "#000";
    return;
  }
  document.body.style.background = "var(--bg)";
  const incoming = buildScene(v);
  stage.appendChild(incoming);
  fitCompany(incoming);
  requestAnimationFrame(()=>{
    incoming.classList.add("on");
    if(outgoing){ outgoing.classList.remove("on"); setTimeout(()=>outgoing.remove(),800); }
  });
}

function tick(){
  const now = new Date();
  if(!urlMode && !withinHours(now)){ render(null); return; }
  const live = activeVisitors(visitors, now);
  if(!live.length){ render(null); return; }
  if(index >= live.length) index = 0;
  render(live[index]);
}
function rotate(){
  const live = activeVisitors(visitors, new Date());
  if(live.length > 1){ index = (index+1) % live.length; tick(); }
}
async function loadSchedule(){
  try{
    const res = await fetch(CONFIG.scheduleUrl + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    visitors = Array.isArray(data.visitors) ? data.visitors : [];
  }catch(err){
    if(!visitors.length) visitors = DEMO_SCHEDULE.visitors;   // REMOVE for production
  }
  tick();
}

/* Single visit passed entirely in the URL — no schedule.json, no Power Automate.
   Example:
     welcome.html?company=Clayco&color=EC3222&logo=logos/clayco.png
                 &note=Fabrication%20walkthrough&start=2026-09-03T06:00:00&end=2026-09-03T17:00:00
   Times are the PC's LOCAL clock. The page shows the visit only between start and
   end (black before/after) and ignores the weekday CONFIG.hours window. */
function queryVisit(){
  const q = new URLSearchParams(location.search);
  const company = q.get("company");
  if(!company) return null;
  return {
    company,
    logo:       q.get("logo") || "",
    brandColor: q.get("color") ? "#" + q.get("color").replace(/^#/, "") : "",
    note:       q.get("note") || "",
    start:      q.get("start") || "",
    end:        q.get("end")   || ""
  };
}

const urlVisit = queryVisit();
if(urlVisit){
  urlMode = true;
  visitors = [urlVisit];
  tick();
  setInterval(tick, 20000);          // flips on/off at start & end
}else{
  loadSchedule();
  setInterval(loadSchedule, CONFIG.pollSeconds*1000);
  setInterval(rotate,       CONFIG.rotateSeconds*1000);
  setInterval(tick,         20000);  // catches the operating-hours boundary
}
</script>
</body>
</html>
