<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burkes Welcome Kiosk — Prototype</title>
<!--
  Burkes Visitor Welcome Display — EARLY PROTOTYPE.
  Single self-contained page, driven entirely by URL query params (no backend).
  Superseded by welcome-display.html (Task 1), which adds schedule.json polling,
  a baked-in logo library, and per-visitor theming. Kept as a reference / quick
  single-TV test page.

  Usage:
    welcome-kiosk.html                              -> Burkes standby slide
    ?company=Accelevation&color=E8822A              -> welcome, monogram badge
    ?company=Accelevation&logo=https://.../logo.png -> welcome with a logo image
    &who=Marcus%20Reed%20%E2%80%94%20Procurement    -> optional visitor-name line
-->
<style>
  :root{ --bg:#141417; --fg:#EAEDF0; --accent:#E8822A; --dim:rgba(255,255,255,.16); }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;cursor:none;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;}
  #screen{position:fixed;inset:0;background:var(--bg);}
  .bar{position:absolute;left:0;right:0;height:.7vh;background:var(--accent);}
  .bar.top{top:0;} .bar.bot{bottom:0;}
  .hair{position:absolute;left:0;right:0;height:1px;background:var(--dim);}
  .hair.top{top:1.9vh;} .hair.bot{bottom:1.9vh;}
  .bk{position:absolute;width:5vh;height:5vh;border:.32vh solid var(--accent);}
  .bk.tl{top:2.7vh;left:2.4vw;border-right:0;border-bottom:0;}
  .bk.tr{top:2.7vh;right:2.4vw;border-left:0;border-bottom:0;}
  .bk.bl{bottom:2.7vh;left:2.4vw;border-right:0;border-top:0;}
  .bk.br{bottom:2.7vh;right:2.4vw;border-left:0;border-top:0;}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:6vh 8vw;
    animation:drift 180s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(.6vw,.4vh)}
    50%{transform:translate(-.3vw,.7vh)}75%{transform:translate(-.6vw,-.4vh)}}
  .eyebrow{font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--fg);font-size:4vw;line-height:1;margin-bottom:3.2vh;}
  .eyebrow .accent{color:var(--accent);}
  .company{font-weight:800;letter-spacing:.01em;color:var(--fg);font-size:7vw;line-height:1.02;}
  .logo img{max-height:34vh;max-width:74vw;object-fit:contain;}
  .mono{height:26vh;width:26vh;border-radius:3vh;display:flex;align-items:center;
    justify-content:center;background:var(--accent);color:#fff;font-weight:800;font-size:12vh;}
  .visitor{font-weight:500;color:var(--fg);opacity:.82;font-size:1.7vw;margin-top:2.6vh;}
  .tagline{font-weight:700;letter-spacing:.30em;text-transform:uppercase;
    color:var(--fg);font-size:2vw;margin-top:4vh;}
  .tagline b{color:var(--accent);padding:0 .5em;}
</style>
</head>
<body>
<div id="screen">
  <div class="bar top"></div><div class="bar bot"></div>
  <div class="hair top"></div><div class="hair bot"></div>
  <div class="bk tl"></div><div class="bk tr"></div><div class="bk bl"></div><div class="bk br"></div>
  <div class="stage" id="stage"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var company = q.get("company") || "";
  var color   = q.get("color");
  var logo    = q.get("logo") || "";
  var who     = q.get("who") || "";
  if (color) document.documentElement.style.setProperty("--accent", "#" + color.replace(/^#/, ""));

  function monogram(name){
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    var ini = parts.slice(0,2).map(function(w){return w[0];}).join("") || "?";
    return '<div class="mono">' + ini.toUpperCase() + '</div>';
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var stage = document.getElementById("stage"), html;
  if (company) {
    html  = '<div class="eyebrow">BURKES <span class="accent">WELCOMES</span></div>';
    html += logo ? '<div class="logo"><img src="' + esc(logo) + '" alt=""></div>'
                 : '<div class="logo">' + monogram(company) + '</div>';
    html += '<div class="company">' + esc(company) + '</div>';
    if (who) html += '<div class="visitor">' + esc(who) + '</div>';
  } else {
    // Standby
    html  = '<div class="company">BURKES</div>';
    html += '<div class="tagline">SAFETY <b>&middot;</b> QUALITY <b>&middot;</b> PRODUCTIVITY</div>';
  }
  stage.innerHTML = html;

  // keep a long-running kiosk fresh
  setTimeout(function(){ location.reload(); }, 6*60*60*1000);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") window.close(); });
</script>
</body>
</html>
